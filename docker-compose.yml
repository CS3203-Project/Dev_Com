version: '3.8'

services:
  app:
    build: .
    ports:
      - '${PORT:-3001}:${PORT:-3001}'
    env_file:
      - .env
    environment:
      - NODE_ENV=production
    restart: unless-stopped
    # External RabbitMQ configuration is handled via environment variables
    # No internal services needed since using external RabbitMQ
